# Based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py313"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN",    # Type annotations not required for HA custom components
    "D203",   # no-blank-line-before-class (incompatible with formatter)
    "D212",   # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
    "ARG001", # HA callback signatures require positional args (e.g. `now`)
]

[lint.mccabe]
max-complexity = 25

[lint.per-file-ignores]
"tests/*" = [
    "S101",    # assert allowed in tests
    "D102",    # docstrings in test methods are noise
    "D104",    # docstring in tests/__init__.py not needed
    "PLR2004", # magic values are fine in test assertions
    "E501",    # long lines are fine in test data
    "SLF001",  # accessing private HA methods (_abort_if_unique_id_configured) is standard in tests
    "PLC0415", # top-level imports not always practical in parameterized test cases
]
